version: 2
updates:
  # Keeps the pinned action SHAs in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # React, Vite+, wrangler and the shader package get CVE alerts and version PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
