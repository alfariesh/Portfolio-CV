version: 2
updates:
  # Keeps the pinned action SHAs in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # React, Vite+, wrangler and the shader package get CVE alerts and version PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # React and its renderer require the same exact version.
      react:
        patterns:
          - react
          - react-dom
    ignore:
      # Match the Node 24 runtime selected by .node-version and CI.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
