name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp check
      - run: vp test
      # The real build: type-check, client and server bundles, every page
      # prerendered. It fails on a missing <title> or an abandoned Suspense
      # boundary, so a green build means every page renders.
      - run: vp run build

  # Deploys main to Cloudflare Workers once checks pass, on a push or a manual
  # run (Actions → CI → Run workflow). Off until the repo has a
  # CLOUDFLARE_ACCOUNT_ID variable, so forks don't fail here; `vp run
  # setup:deploy` sets it and the CLOUDFLARE_API_TOKEN secret. The `secrets`
  # context can't be read from a job-level `if`, so the first step fails fast
  # with instructions when the token is missing instead of leaving wrangler's
  # non-interactive error to explain it.
  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Fail fast if the API token is missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repo. Create a token from the 'Edit Cloudflare Workers' template at https://dash.cloudflare.com/profile/api-tokens, then: gh secret set CLOUDFLARE_API_TOKEN (or rerun vp run setup:deploy)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
